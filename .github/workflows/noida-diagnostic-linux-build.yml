name: Noida diagnostic Linux build only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Publish this workflow and its two offline-font assets separately from
      # the accepted source commit. No deploy trigger or deploy action exists.
      - name: Check out workflow assets
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ci
          persist-credentials: false

      - name: Check out exact accepted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 3224f9e0a7ceca4377d636239c8ef53dc6cf0d9d
          path: source
          persist-credentials: false

      - name: Fail closed on source or asset mismatch
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git -C source rev-parse HEAD)" = 3224f9e0a7ceca4377d636239c8ef53dc6cf0d9d
          test "$(git -C source ls-tree -r --name-only HEAD app | grep -Ec '/(page|route)\.tsx?$')" = 27
          test ! -e source/node_modules
          test ! -e source/.next
          test ! -e source/.env.local
          test ! -e source/.env.production
          test -f ci/.github/noida-build/offline-fonts.tar
          test -f ci/.github/noida-build/offline-fonts.cjs
          echo '3007eb58528ad29a8c1e7abfed86ea415998252fcaa063d88d5de04ec854aea8  ci/.github/noida-build/offline-fonts.tar' | sha256sum -c -
          echo '20ba863458727f8ab959b69efaa075dbb444343cbb623190a7fdcd3c52ef2f67  ci/.github/noida-build/offline-fonts.cjs' | sha256sum -c -

      - name: Extract approved offline fonts
        shell: bash
        run: |
          set -euo pipefail
          # Exact font bytes are pinned from the previously checksum-verified archive.
          # Copy only regular allowlisted fonts; never extract macOS metadata,
          # archive paths, links, permissions or extended attributes.
          python3 - <<'FONTS'
          import hashlib,json,os,pathlib,tarfile
          expected={'013b72fa676f92e0-s.woff2': 'e27f657e38d52887baa3b6b2f812bef93dfdd356f0810e40edd4ee284cc7e9f6', '22a5144ee8d83bca-s.p.woff2': '9b6f5ff45b278c744b5f379a2c4ecbaf858a842b8eaf82ac8d21b699ca16c608', '2b5b02fc7e511755-s.woff2': '745994b5cd950ec201b66526375f057d540847cccfc70f4f24f5f571d26d3923', '65f03d54ccadf4a8-s.woff2': 'd67e4a94ba498635f764ddca7d1ec4271f5642f032eb24b426764480f66f8497', '7d4881bb7e1bf84d-s.p.woff2': '5f3d6ad60f29d6cb708414ec6887163d63bf197377ef5417d2483ff31ace6c3b', '9766a7e9e2e0ad5a-s.woff2': '6129fc8571c3e0cb0a4c41f5160c974a843b055009dc4ad8858bd808e18a2d86', 'aa016aab0e6d1295-s.woff2': '58a6b173d5ca1dec92166ea3c6cb1a84a4144556d10928ac14e8e6b40e4787bd', 'b66cf8e69499582a-s.woff2': 'f689f638f29fff460a2d5749edb5d5c38d7bef0389f32032d871f23fc6ebb008', 'b9408752a0c24fb9-s.woff2': '75b3bedbebc35f347c0ae3b416aa871941555357e7b0f83767eb5987875589ed', 'e038a29029a234f2-s.woff2': '16e1d48b6dd29eb240aec5db36184eb182933c082cd43de7f35af686d58087d2', 'f639721981034f88-s.woff2': 'b7a545bbb08256bd809f11cfe66d88da3e22d169ea4407737b1ef0ec1ed3d791'}
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'noida-fonts'
          dest.mkdir(exist_ok=True)
          assert not any(dest.iterdir()), 'Font destination must be empty'
          seen=set()
          with tarfile.open('ci/.github/noida-build/offline-fonts.tar') as archive:
              for member in archive.getmembers():
                  parts=pathlib.PurePosixPath(member.name).parts
                  if any(p.startswith('._') or p in ('__MACOSX','.DS_Store') for p in parts):
                      continue
                  assert member.name in expected and member.isfile(), 'Unexpected font archive entry'
                  assert member.name not in seen, 'Duplicate font entry'
                  data=archive.extractfile(member).read()
                  assert data[:4]==b'wOF2' and hashlib.sha256(data).hexdigest()==expected[member.name], 'Font integrity mismatch'
                  (dest/member.name).write_bytes(data)
                  seen.add(member.name)
          assert seen==set(expected) and len(seen)==11
          assert {p.name for p in dest.iterdir()}==seen
          for name,digest in expected.items():
              assert hashlib.sha256((dest/name).read_bytes()).hexdigest()==digest
          print('PASS: exactly 11 real WOFF2 fonts; all pinned SHA-256 checksums match')
          FONTS

      # Dependency retrieval is separate from the application build. npm
      # lifecycle scripts are disabled and no Production secret is supplied.
      - name: Install lockfile dependencies on Linux without scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/noida-npm-cache"
          docker run --rm --platform linux/amd64 --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --env npm_config_cache=/npm-cache \
            --mount "type=bind,src=$PWD/source,dst=/work" \
            --mount "type=bind,src=$RUNNER_TEMP/noida-npm-cache,dst=/npm-cache" \
            --workdir /work node:24.11.1-bookworm-slim@sha256:44b49d6e2d23f6754fb084ef9d34ff14590343ad1ee168f8acf8f7bc9fccde2f \
            npm ci --ignore-scripts --legacy-peer-deps --include=optional

      # This is the existing resolved tool lock, not a new ranged resolution.
      # Managed native-CLI builder cache is a separate prerequisite: npm's
      # @vercel/next installation alone does NOT populate the vlt graph cache.
      - name: Materialize pinned CLI and builder lock outside accepted source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/noida-tools"
          python3 - <<'PYTOOLS'
          import base64,gzip,hashlib,os,pathlib
          data=gzip.decompress(base64.b64decode(""))
          assert hashlib.sha256(data).hexdigest()=="8eb35a8a2184ea6546022b644e8ef39945a1e8485f2b7ef4b31af86738cba318"
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"noida-tools"
          (root/"package-lock.json").write_bytes(data)
          (root/"package.json").write_text('{"private":true,"dependencies":{"vercel":"65.15.0","@vercel/next":"29.1.0","@vercel/build-utils":"15.3.0"}}')
          PYTOOLS

      - name: Stage pinned tool dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges \
            --env HOME=/tmp --env npm_config_cache=/npm-cache \
            --mount "type=bind,src=$RUNNER_TEMP/noida-tools,dst=/tools" \
            --mount "type=bind,src=$RUNNER_TEMP/noida-npm-cache,dst=/npm-cache" \
            --workdir /tools node:24.11.1-bookworm-slim@sha256:44b49d6e2d23f6754fb084ef9d34ff14590343ad1ee168f8acf8f7bc9fccde2f sh -eu -c '
              npm ci --ignore-scripts --include=optional --no-audit --no-fund
              node -e "const expected={\"vercel\":\"65.15.0\",\"@vercel/next\":\"29.1.0\",\"@vercel/build-utils\":\"15.3.0\",\"@vercel/vc-native-linux-x64\":\"65.15.0\"};for(const [name,version] of Object.entries(expected)){if(require(name+\"/package.json\").version!==version)throw Error(\"Tool pin mismatch: \"+name)}if(typeof require(\"@vercel/next\").build!==\"function\")throw Error(\"Builder entry missing\")"
            '

      # This accepted source is Next.js 16.4.5 and the local project settings
      # select framework nextjs. CLI 65.15.0 pins @vercel/next 29.1.0 to the
      # graph below. Preinstall stages all graphs; only Next is copied to the
      # isolated cache. If build requests another graph, it fails closed.
      # No accepted application source, project link, env files or host home
      # is mounted into this network-enabled dependency-staging container.
      - name: Stage native managed builder cache on Linux x64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/noida-builders-all" "$RUNNER_TEMP/noida-builders"
          docker run --rm --platform linux/amd64 --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges \
            --env HOME=/tmp --env CI=1 --env VERCEL_TELEMETRY_DISABLED=1 \
            --env VERCEL_BUILDERS_DIR=/builders-all \
            --mount "type=bind,src=$RUNNER_TEMP/noida-tools,dst=/tools,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/noida-builders-all,dst=/builders-all" \
            --workdir /tmp node:24.11.1-bookworm-slim@sha256:44b49d6e2d23f6754fb084ef9d34ff14590343ad1ee168f8acf8f7bc9fccde2f \
            /tools/node_modules/.bin/vercel builders preinstall </dev/null
          python3 - <<'CACHE'
          import hashlib,json,os,pathlib,shutil
          base=pathlib.Path(os.environ['RUNNER_TEMP'])
          root=base/'noida-builders'
          source=base/'noida-builders-all'
          graph='3acc6c05bbf2fa7b780bf531eb9a8a31b6e591785fc76763d89c507560d8d76d'
          assert not any(root.iterdir()), 'Isolated cache must be empty'
          assert (source/graph/'.vercel-builder-graph').read_text().strip()==graph
          shutil.copytree(source/graph,root/graph,symlinks=True)
          assert {p.name for p in root.iterdir()}=={graph}, 'Only Next builder graph may be staged'
          target=root/graph
          assert (target/'.vercel-builder-graph').read_text().strip()==graph
          pkg=json.loads((target/'node_modules/@vercel/next/package.json').read_text())
          assert pkg['name']=='@vercel/next' and pkg['version']=='29.1.0'
          assert (target/'vlt-lock.json').is_file()
          records={}
          for path in sorted(root.rglob('*')):
              name=path.relative_to(root).as_posix()
              if path.is_symlink():
                  assert path.resolve().is_relative_to(root.resolve()), 'Cache symlink escapes cache'
                  assert path.exists(), 'Dangling Next builder dependency'
                  records[name]={'link':os.readlink(path)}
              elif path.is_file():
                  records[name]={'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
          assert records
          data=(json.dumps(records,sort_keys=True,separators=(',',':'))+'\n').encode()
          dest=root.parent/'noida-builders-manifest.json'
          dest.write_bytes(data)
          print('Managed cache manifest SHA-256:',hashlib.sha256(data).hexdigest())
          CACHE

      - name: Package with no network, credentials, or Docker socket
        shell: bash
        run: |
          set -euo pipefail
          # Export tracked accepted files only: never mount checkout .git,
          # host home, credentials, macOS output, or runner Docker socket.
          mkdir -p "$RUNNER_TEMP/noida-package"
          git -C source archive 3224f9e0a7ceca4377d636239c8ef53dc6cf0d9d | tar -x -C "$RUNNER_TEMP/noida-package"
          docker run --rm -i --platform linux/amd64 --network none --cap-drop ALL \
            --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$RUNNER_TEMP/noida-package,dst=/work" \
            --mount "type=bind,src=$RUNNER_TEMP/noida-tools,dst=/tools,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/noida-npm-cache,dst=/npm-cache" \
            --mount "type=bind,src=$RUNNER_TEMP/noida-builders,dst=/builders,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/noida-builders-manifest.json,dst=/cache-manifest.json,readonly" \
            --mount "type=bind,src=$PWD/ci/.github/noida-build/offline-fonts.cjs,dst=/assets/offline-fonts.cjs,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/noida-fonts,dst=/fonts,readonly" \
            --workdir /work --env HOME=/tmp --env CI=1 \
            --env VERCEL_BUILDERS_DIR=/builders --env VERCEL_TELEMETRY_DISABLED=1 \
            --env npm_config_offline=true --env npm_config_cache=/npm-cache \
            --env NEXT_FONT_GOOGLE_MOCKED_RESPONSES=/assets/offline-fonts.cjs \
            --env MONGODB_URI=mongodb://127.0.0.1:1/build-only \
            --env PAYLOAD_SECRET=build-only-placeholder \
            --env NEXT_TELEMETRY_DISABLED=1 \
            node:24.11.1-bookworm-slim@sha256:44b49d6e2d23f6754fb084ef9d34ff14590343ad1ee168f8acf8f7bc9fccde2f bash -seu <<'ISOLATED'
          set -o pipefail
          test ! -e /var/run/docker.sock
          test ! -e /run/docker.sock
          node <<'CHECK'
          const fs=require('fs'),os=require('os');
          if(process.platform!=='linux'||process.arch!=='x64')throw Error('Platform mismatch');
          if(Object.keys(os.networkInterfaces()).some(n=>n!=='lo'))throw Error('Network isolation absent');
          for(const n of Object.keys(process.env))if(/TOKEN|PASSWORD|COOKIE|AWS_|GITHUB_|ACTIONS_/.test(n))throw Error('Unexpected credential-bearing environment key');
          for(const n of fs.readdirSync('.'))if(/^\.env($|\.)/.test(n)&&!/^\.env\.(example|sample|template)$/.test(n))throw Error('Environment file forbidden');
          if(fs.existsSync('.vercel'))throw Error('Existing project metadata forbidden in packaging copy');
          fs.mkdirSync('.vercel');
          fs.writeFileSync('.vercel/project.json',JSON.stringify({orgId:'team_AhEqH0YD4TUEsY1bwgLq00Mg',projectId:'prj_BaMZLgjsftAewYTezNLEV0zG5v7A',settings:{framework:'nextjs',buildCommand:'npm run build -- --webpack',installCommand:'npm ci --offline --ignore-scripts --legacy-peer-deps --include=optional --no-audit --no-fund',devCommand:null,outputDirectory:null,rootDirectory:null}}));
          CHECK
          # Verify the entire staged content, not just CLI completion markers.
          node <<'CACHEVERIFY'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const expected=JSON.parse(fs.readFileSync('/cache-manifest.json'));
          const actual={};
          function visit(dir){for(const e of fs.readdirSync(dir,{withFileTypes:true})){
            const p=path.join(dir,e.name),name=path.relative('/builders',p);
            if(e.isSymbolicLink()){
              if(!fs.realpathSync(p).startsWith('/builders/'))throw Error('Cache symlink escape');
              actual[name]={link:fs.readlinkSync(p)};
            }else if(e.isDirectory())visit(p);
            else if(e.isFile())actual[name]={sha256:crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')};
            else throw Error('Unexpected cache file type');
          }}
          visit('/builders');
          if(Object.keys(actual).length!==Object.keys(expected).length)throw Error('Cache inventory mismatch');
          for(const [n,v] of Object.entries(expected))if(JSON.stringify(actual[n])!==JSON.stringify(v))throw Error('Cache integrity mismatch');
          console.log('Staged managed-cache integrity PASS');
          CACHEVERIFY
          # Only the pinned Next graph is present; missing graph requests fail
          # under network none and the read-only builder mount.
          node -e 'const p=require("/builders/3acc6c05bbf2fa7b780bf531eb9a8a31b6e591785fc76763d89c507560d8d76d/node_modules/@vercel/next/package.json");if(p.version!=="29.1.0")throw Error("Next builder mismatch")'
          npm ci --offline --ignore-scripts --legacy-peer-deps --include=optional --no-audit --no-fund
          node -e 'require("sharp");const fs=require("fs");const p=require.resolve("@img/sharp-linux-x64/sharp.node");const b=fs.readFileSync(p);if(b.readUInt32BE(0)!==0x7f454c46||b.readUInt16LE(18)!==62)throw Error("Sharp is not Linux x64 ELF")'
          # No pull, --yes, --deployment, account token, or remote project lookup.
          # A missing remote dependency/settings fails under network none.
          /tools/node_modules/.bin/vercel build --prod </dev/null
          node <<'VERIFY'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(d,e.name)):[path.join(d,e.name)]);
          const sources=walk('app').filter(p=>/\/(page|route)\.tsx?$/.test(p));
          if(sources.length!==27)throw Error('Source route inventory mismatch');
          const manifest=JSON.parse(fs.readFileSync('.next/server/app-paths-manifest.json'));
          for(const p of sources){const k='/'+p.replace(/^app\//,'').replace(/\.tsx?$/,'');if(!manifest[k])throw Error('Missing compiled baseline route: '+k)}
          const out='.vercel/output',config=JSON.parse(fs.readFileSync(out+'/config.json'));
          if(config.version!==3||!Array.isArray(config.routes))throw Error('Invalid Vercel output config');
          if(!fs.statSync(out+'/static').isDirectory())throw Error('Missing static output');
          const files=walk(out),funcs=files.filter(p=>p.endsWith('/.vc-config.json'));
          if(!funcs.length)throw Error('Missing Vercel functions');
          for(const p of funcs){const c=JSON.parse(fs.readFileSync(p));if(!c.runtime)throw Error('Missing function runtime');if(c.runtime.startsWith('nodejs')&&(!c.handler||!fs.existsSync(path.join(path.dirname(p),c.handler))))throw Error('Missing function handler')}
          let sharp=0;
          for(const p of files.filter(p=>p.endsWith('.node'))){const b=fs.readFileSync(p);if(b.readUInt32BE(0)!==0x7f454c46||b.readUInt16LE(18)!==62)throw Error('Non Linux x64 native output');if(p.includes('sharp'))sharp++}
          if(!sharp)throw Error('Linux Sharp absent from packaged output');
          for(const p of files){if(fs.lstatSync(p).isSymbolicLink()){const real=fs.realpathSync(p);if(!real.startsWith(path.resolve(out)+path.sep))throw Error('Nonportable output symlink')}}
          // Output routing equivalence must additionally be reviewed against
          // config.routes rewrites/function routing before release readiness.
          console.log('27 compiled baseline routes; v3 structure and Linux native binaries verified');
          VERIFY
          ISOLATED
          tar -cf "$RUNNER_TEMP/noida-prebuilt.tar" -C "$RUNNER_TEMP/noida-package" .vercel/output
          sha256sum "$RUNNER_TEMP/noida-prebuilt.tar" | tee "$RUNNER_TEMP/noida-prebuilt.sha256"
          git -C source diff --exit-code

      - name: Retain verified build-only output and cache evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: noida-prebuilt-3224f9e0-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/noida-prebuilt.tar
            ${{ runner.temp }}/noida-prebuilt.sha256
            ${{ runner.temp }}/noida-builders-manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
